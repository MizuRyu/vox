name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --product Vox
      - run: swift test --no-parallel

  benchmarks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: swift run --package-path benchmarks m0-core-tests
      # 手元では flake.nix の benchPython が jiwer を入れる。ランナーには nix が無い
      - run: uv run --no-project --with jiwer python -m unittest discover -s benchmarks/Tests/BenchmarkReport -v

  prosody:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m unittest discover -s tests -t .
        working-directory: benchmarks/prosody
